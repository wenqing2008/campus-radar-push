# 候选人画像与准入规则（行业 KnowHow 外置，改这里不动代码）
# 借鉴 aihot 项目的核心架构决策：行业知识全部外置成 Markdown/YAML，代码零改动。
# 修改画像只需编辑本文件。

candidates:
  A:
    name: 河海大学 2027届本科
    major: 给排水科学与工程
    grade: "2027"
    location_prefer: [天津, 北京, 河北, 雄安, 石家庄, 唐山, 秦皇岛, 保定, 廊坊, 沧州, 邯郸, 邢台, 衡水, 张家口, 承德]
