      "金属材料工程", "无损检测", "有色金属", "金属冶炼", "材料加工",
      "粉末冶金", "材料科学与工程", "矿业工程", "复合材料"]

# 分级门槛（借鉴 aihot：官方源高分门槛高，聚合源门槛低）
thresholds:
  ready_min_score: 60      # 达到即可列【可直接投递】
  drill_min_score: 35      # 达到即列【待钻取】，低于此丢弃
  strong_major_bonus: 30    # 强专业匹配加分
  mid_major_bonus: 18      # 中等匹配加分
  nature_state_bonus: 20   # 国企/央企加分
  location_perfect_bonus: 25   # 首选城市加分
  location_north_bonus: 10 # 北方其他城市加分
  deadline_near_bonus: 15  # 30天内截止加分
  no_deadline_penalty: -10 # 无截止日期减分
  non_state_penalty: -30   # 非国企减分
  degree_mismatch_penalty: -40  # 学历不符减分
  senior_only_penalty: -25  # 仅招硕士/博士减分
