    # 学历硬门槛：本科可报（含专科及以上排除）
    degree_allow: ["本科", "大专", "专科", "硕士", "研究生", "博士"]
    degree_block: ["博士", "硕士"]   # 仅当单位明确要求硕士时才排除，见 knowledge 中说明
    major_keywords: ["给排水", "水务", "市政", "水处理", "环境工程", "环境科学", "暖通",
                     "给排水科学与工程", "水利水电", "土木", "工程建设", "市政工程",
                     "给水排水", "城镇给排水", "排水工程", "污水处理", "水污染",
                     "海绵城市", "燃气", "热力", "流体输配"]
    # 匹配强度分级关键词（借鉴 aihot 评分思路：强/中/弱信号）
    major_strong: ["给排水", "给排水科学与工程", "给水排水", "水务", "水处理",
                   "城镇给排水", "排水工程", "市政工程", "市政"]
    major_mid: ["环境工程", "环境科学", "暖通", "水利水电", "土木", "污水处理",
                "海绵城市", "水污染", "燃气", "热力", "工程建设"]
    unit_keywords: ["国企", "央企", "国有", "集团公司", "设计院", "水务集团", "市政"]
    excluded_nature: ["民营", "外商独资", "合资", "个体"]

