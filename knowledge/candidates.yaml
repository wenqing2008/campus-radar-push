# 搜索关键词矩阵：国聘 API 的 keyword 检索用
search_keywords:
  A: ["给排水", "水务", "市政工程", "水处理", "环境工程给排水", "给排水科学与工程",
      "给水排水", "排水工程", "污水", "市政", "水利水电", "暖通", "热力"]
