name: daily-push

on:
  # 每天北京时间 9:00（UTC 1:00）跑
  schedule:
    - cron: '0 1 * * *'
  # 手动触发（workflow_dispatch）
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: run pushplus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_report.py