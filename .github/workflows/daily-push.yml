name: daily-push

# 【已停用定时】2026-09-30 起本项目不再承担每日推送，原因：
# 1. daily_report.py 推送的是代码里写死的 BASE_CONTENT 静态文本，从不联网采集；
# 2. 与新系统 D:\Workbuddy\campus-radar-live（真采集）重复推送，用户一天会收到两条高度雷同内容。
# 现改为仅保留手动触发，供临时核查历史内容使用。
# 真采集版定时任务：WorkBuddy 自动化 automation-campus-morning-radar（工作日 08:30）
on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: run pushplus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python daily_report.py